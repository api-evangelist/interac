name: Interac
kind: company
description: >-
  Interac Corp. is Canada's domestic payments and digital verification network,
  founded in 1984 as the Interac Association and reorganized as a for-profit
  corporation in 2018 (through the merger of Interac Association and Acxsys).
  Headquartered in Toronto and owned by a consortium of Canadian financial
  institutions and payment processors, Interac is shared national payment
  infrastructure rather than a chartered bank — it has no Schedule I / Schedule II
  banking charter. It operates the Interac Debit domestic debit network, Interac
  e-Transfer (used by roughly 88% of Canadians), and Interac verification / digital
  identity services, connecting 300+ financial institutions and processing on the
  order of 18.6 million transactions a day. As one of the core Canadian rails
  alongside Payments Canada, Interac runs the Interac Innovation Hub developer
  program. Its most openly documented public API surface is the Interac Hub
  Verification Service, an HTTP identity-verification API built on OAuth 2.0 and
  OpenID Connect (Authorization Code Grant with Pushed Authorization Requests);
  a self-serve sandbox is available through the Hub Verification developer portal,
  while full production access and other products (Business Request Money, Interac
  Direct) are partner-gated behind a commercial relationship with an issuing
  financial institution.
