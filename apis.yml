apis:
- aid: interac:interac-hub-verification-api
  name: Interac Hub Verification API
  description: >-
    The Interac Hub is an HTTP API that simplifies digital identity verification. Relying parties obtain
    verified identity data through financial-institution authentication (Interac Verification Service,
    IVS) and/or government-ID plus biometric selfie checks (Interac Document Verification Service, IDVS).
    It uses the OAuth 2.0 / OpenID Connect 1.0 Authorization Code Grant flow (with Pushed Authorization
    Requests), and offers a self-serve developer sandbox.
  humanURL: https://documents.hub-verify.innovation.interac.ca/docs/overview
  baseURL: https://gateway-portal.hub-verify.innovation.interac.ca
